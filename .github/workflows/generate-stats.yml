name: Generate GitHub Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: veruscodes
        run: |
          cat << 'SCRIPT' > generate.js
          const https = require('https');
          const fs = require('fs');

          const username = process.env.USERNAME;
          const token = process.env.GITHUB_TOKEN;

          function fetch(query) {
            return new Promise((resolve, reject) => {
              const data = JSON.stringify({ query });
              const options = {
                hostname: 'api.github.com',
                path: '/graphql',
                method: 'POST',
                headers: {
                  'Authorization': `bearer ${token}`,
                  'User-Agent': 'GitHub-Stats-Generator',
                  'Content-Type': 'application/json',
                  'Content-Length': data.length,
                },
              };
              const req = https.request(options, (res) => {
                let body = '';
                res.on('data', (chunk) => body += chunk);
                res.on('end', () => resolve(JSON.parse(body)));
              });
              req.on('error', reject);
              req.write(data);
              req.end();
            });
          }

          async function getContributions() {
            const query = `
              {
                user(login: "${username}") {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          contributionCount
                          date
                          color
                        }
                      }
                    }
                    repositories(first: 100, ownerAffiliations: OWNER) {
                      nodes {
                        name
                        primaryLanguage { name color }
                        stargazerCount
                        forkCount
                        description
                      }
                    }
                    pullRequests { totalCount }
                    issues { totalCount }
                    followers { totalCount }
                    following { totalCount }
                  }
                  repositoryContributions: repositories(ownerAffiliations: OWNER, first: 100) {
                    nodes { name }
                  }
                }
              }
            `;
            return fetch(query);
          }

          function generateStreakSVG(commits, streak, longest) {
            return `<svg width="600" height="160" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#161b22"/>
                  <stop offset="100%" style="stop-color:#0d1117"/>
                </linearGradient>
              </defs>
              <rect width="600" height="160" fill="url(#bg)" rx="10"/>
              <text x="30" y="45" fill="#8b949e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">CURRENT STREAK</text>
              <text x="30" y="80" fill="#58a6ff" font-family="Arial, sans-serif" font-size="36" font-weight="bold">${streak}</text>
              <text x="30" y="100" fill="#8b949e" font-family="Arial, sans-serif" font-size="11">days</text>
              <text x="200" y="45" fill="#8b949e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">LONGEST STREAK</text>
              <text x="200" y="80" fill="#3fb950" font-family="Arial, sans-serif" font-size="36" font-weight="bold">${longest}</text>
              <text x="200" y="100" fill="#8b949e" font-family="Arial, sans-serif" font-size="11">days</text>
              <text x="400" y="45" fill="#8b949e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">TOTAL COMMITS</text>
              <text x="400" y="80" fill="#f0883e" font-family="Arial, sans-serif" font-size="36" font-weight="bold">${commits}</text>
              <text x="400" y="100" fill="#8b949e" font-family="Arial, sans-serif" font-size="11">this year</text>
              <text x="30" y="140" fill="#21262d" font-family="Arial, sans-serif" font-size="10">Updated: ${new Date().toISOString().split('T')[0]}</text>
            </svg>`;
          }

          function generateCalendarSVG(weeks) {
            const cellSize = 14;
            const cellGap = 3;
            const totalWeeks = weeks.length;
            const width = totalWeeks * (cellSize + cellGap) + 40;
            const height = 7 * (cellSize + cellGap) + 40;

            let cells = '';
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            let lastMonth = -1;

            weeks.forEach((week, weekIdx) => {
              week.contributionDays.forEach((day, dayIdx) => {
                const x = weekIdx * (cellSize + cellGap) + 30;
                const y = dayIdx * (cellSize + cellGap) + 25;
                const date = new Date(day.date);
                const month = date.getMonth();

                if (month !== lastMonth && dayIdx === 0) {
                  cells += `<text x="${x}" y="12" fill="#8b949e" font-family="Arial, sans-serif" font-size="9">${months[month]}</text>`;
                  lastMonth = month;
                }

                const color = day.contributionCount === 0 ? '#161b22' :
                  day.contributionCount <= 3 ? '#0e4429' :
                  day.contributionCount <= 6 ? '#006d32' :
                  day.contributionCount <= 9 ? '#26a641' : '#39d353';

                cells += `<rect x="${x}" y="${y}" width="${cellSize}" height="${cellSize}" rx="2" fill="${color}">
                  <title>${day.contributionCount} contributions on ${day.date}</title>
                </rect>`;
              });
            });

            return `<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">
              <rect width="${width}" height="${height}" fill="#0d1117" rx="10"/>
              <text x="20" y="18" fill="#8b949e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Contribution Calendar</text>
              ${cells}
            </svg>`;
          }

          function generateReposSVG(repos) {
            const langMap = {};
            repos.forEach(r => {
              if (r.primaryLanguage) {
                const lang = r.primaryLanguage.name;
                if (!langMap[lang]) langMap[lang] = { count: 0, color: r.primaryLanguage.color };
                langMap[lang].count++;
              }
            });

            const sorted = Object.entries(langMap).sort((a, b) => b[1].count - a[1].count).slice(0, 10);
            const barWidth = 300;
            const maxCount = sorted.length > 0 ? sorted[0][1].count : 1;

            let bars = '';
            sorted.forEach(([lang, data], i) => {
              const y = i * 28 + 35;
              const w = (data.count / maxCount) * barWidth;
              bars += `
                <text x="20" y="${y + 5}" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="11">${lang}</text>
                <rect x="100" y="${y - 5}" width="${w}" height="16" rx="3" fill="${data.color || '#58a6ff'}"/>
                <text x="${100 + w + 8}" y="${y + 5}" fill="#8b949e" font-family="Arial, sans-serif" font-size="11">${data.count}</text>
              `;
            });

            return `<svg width="500" height="${sorted.length * 28 + 50}" xmlns="http://www.w3.org/2000/svg">
              <rect width="500" height="${sorted.length * 28 + 50}" fill="#0d1117" rx="10"/>
              <text x="20" y="22" fill="#8b949e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Top Languages</text>
              ${bars}
            </svg>`;
          }

          function generateOverviewSVG(data) {
            const stats = [
              { label: 'Total Contributions', value: data.contributionsCollection.contributionCalendar.totalContributions, color: '#58a6ff' },
              { label: 'Public Repos', value: data.repositoryContributions.nodes.length, color: '#3fb950' },
              { label: 'Pull Requests', value: data.contributionsCollection.pullRequests.totalCount, color: '#f0883e' },
              { label: 'Issues', value: data.contributionsCollection.issues.totalCount, color: '#bc8cff' },
              { label: 'Followers', value: data.contributionsCollection.followers.totalCount, color: '#f778ba' },
            ];

            let items = '';
            stats.forEach((s, i) => {
              const x = (i % 3) * 170 + 30;
              const y = Math.floor(i / 3) * 75 + 40;
              items += `
                <text x="${x}" y="${y}" fill="#8b949e" font-family="Arial, sans-serif" font-size="11">${s.label}</text>
                <text x="${x}" y="${y + 28}" fill="${s.color}" font-family="Arial, sans-serif" font-size="28" font-weight="bold">${s.value}</text>
              `;
            });

            return `<svg width="540" height="120" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="ovbg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#161b22"/>
                  <stop offset="100%" style="stop-color:#0d1117"/>
                </linearGradient>
              </defs>
              <rect width="540" height="120" fill="url(#ovbg)" rx="10"/>
              <text x="20" y="24" fill="#8b949e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Profile Overview</text>
              ${items}
            </svg>`;
          }

          function smoothPath(points) {
            if (points.length < 2) return '';
            let d = `M${points[0].x} ${points[0].y}`;
            for (let i = 0; i < points.length - 1; i++) {
              const p0 = points[i === 0 ? i : i - 1];
              const p1 = points[i];
              const p2 = points[i + 1];
              const p3 = points[i + 2 < points.length ? i + 2 : i + 1];
              const cp1x = p1.x + (p2.x - p0.x) / 6;
              const cp1y = p1.y + (p2.y - p0.y) / 6;
              const cp2x = p2.x - (p3.x - p1.x) / 6;
              const cp2y = p2.y - (p3.y - p1.y) / 6;
              d += ` C${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x} ${p2.y}`;
            }
            return d;
          }

          function generateActivitySVG(weeks, totalContributions = 0) {
            const now = new Date();
            const buckets = [];
            for (let i = 11; i >= 0; i--) {
              const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
              buckets.push({ label: d.toLocaleString('en-US', { month: 'short' }), year: d.getFullYear(), month: d.getMonth(), total: 0 });
            }
            weeks.forEach(w => w.contributionDays.forEach(day => {
              const date = new Date(day.date);
              const b = buckets.find(b => b.year === date.getFullYear() && b.month === date.getMonth());
              if (b) b.total += day.contributionCount;
            }));

            const width = 1200;
            const height = 340;
            const paddingLeft = 70;
            const paddingRight = 50;
            const paddingTop = 95;
            const paddingBottom = 65;

            const chartWidth = width - paddingLeft - paddingRight;
            const chartHeight = height - paddingTop - paddingBottom;
            const baseline = paddingTop + chartHeight;

            const values = buckets.map(b => b.total);
            const sumContributions = values.reduce((a, b) => a + b, 0);
            const commitsTotal = totalContributions || sumContributions || 0;
            const maxVal = Math.max(...values, 10);
            const niceMax = Math.ceil(maxVal / 10) * 10 || 50;
            const weeklyAvg = (commitsTotal / 52).toFixed(1);
            const peakIndex = values.indexOf(maxVal);

            const points = buckets.map((b, i) => {
              const x = paddingLeft + (i * chartWidth) / (buckets.length - 1);
              const y = baseline - (b.total / niceMax) * chartHeight;
              return { x, y, label: b.label, total: b.total, year: b.year };
            });

            const linePath = smoothPath(points);
            const areaPath = `${linePath} L ${points[points.length - 1].x.toFixed(1)} ${baseline} L ${points[0].x.toFixed(1)} ${baseline} Z`;

            const gridSteps = 4;
            let gridLines = '';
            for (let i = 0; i <= gridSteps; i++) {
              const y = baseline - (i * chartHeight) / gridSteps;
              const val = Math.round((i * niceMax) / gridSteps);
              gridLines += `
                <line x1="${paddingLeft}" y1="${y.toFixed(1)}" x2="${width - paddingRight}" y2="${y.toFixed(1)}" stroke="#2E374A" stroke-dasharray="3 3"/>
                <text x="${paddingLeft - 14}" y="${(y + 4).toFixed(1)}" fill="#6C7A9C" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" text-anchor="end">${val}</text>
              `;
            }

            let xLabels = `<line x1="${paddingLeft}" y1="${baseline}" x2="${width - paddingRight}" y2="${baseline}" stroke="#2E374A" stroke-width="1"/>`;
            points.forEach((p, i) => {
              const isPeak = i === peakIndex;
              xLabels += `
                <line x1="${p.x.toFixed(1)}" y1="${baseline}" x2="${p.x.toFixed(1)}" y2="${baseline + 6}" stroke="#2E374A"/>
                <text x="${p.x.toFixed(1)}" y="${baseline + 26}" fill="${isPeak ? '#00E396' : '#8C9BAE'}" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="${isPeak ? '700' : '400'}" text-anchor="middle">${p.label}</text>
              `;
            });

            let markers = '';
            points.forEach((p, i) => {
              const isPeak = i === peakIndex;
              if (isPeak) {
                markers += `
                  <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="8" fill="#00E396" fill-opacity="0.25"/>
                  <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="#00E396" stroke="#0E1326" stroke-width="2"/>
                  
                  <g transform="translate(${p.x.toFixed(1)}, ${(p.y - 32).toFixed(1)})">
                    <rect x="-42" y="-18" width="84" height="24" rx="4" fill="#1B213B" stroke="#00E396" stroke-width="1.5"/>
                    <text x="0" y="-2" fill="#00E396" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">${p.total} commits</text>
                  </g>
                `;
              } else {
                markers += `
                  <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="#008FFB" stroke="#0E1326" stroke-width="2">
                    <title>${p.label}: ${p.total} commits</title>
                  </circle>
                `;
              }
            });

            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="100%" role="img" aria-label="GitHub Commit Activity Chart">
            <defs>
              <linearGradient id="apexBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0E1326"/>
                <stop offset="100%" stop-color="#141B33"/>
              </linearGradient>

              <linearGradient id="apexLine" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#008FFB"/>
                <stop offset="60%" stop-color="#00E396"/>
                <stop offset="100%" stop-color="#775DD0"/>
              </linearGradient>

              <linearGradient id="apexArea" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#008FFB" stop-opacity="0.25"/>
                <stop offset="100%" stop-color="#008FFB" stop-opacity="0.0"/>
              </linearGradient>

              <linearGradient id="apexBorder" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2E374A"/>
                <stop offset="100%" stop-color="#1B213B"/>
              </linearGradient>
            </defs>

            <rect width="${width}" height="${height}" rx="12" fill="url(#apexBg)"/>
            <rect width="${width - 2}" height="${height - 2}" x="1" y="1" rx="11" fill="none" stroke="url(#apexBorder)" stroke-width="1"/>

            <g transform="translate(40, 42)">
              <text x="0" y="0" fill="#F1F5F9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Commit Activity</text>
              <text x="0" y="22" fill="#6C7A9C" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13">Monthly commit distribution over the last 12 months</text>
            </g>

            <g transform="translate(${width - 40}, 42)">
              <g transform="translate(-240, -4)">
                <circle cx="0" cy="0" r="4" fill="#008FFB"/>
                <text x="12" y="4" fill="#94A3B8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12">Total: <tspan fill="#F1F5F9" font-weight="700">${commitsTotal}</tspan></text>
              </g>
              <g transform="translate(-130, -4)">
                <circle cx="0" cy="0" r="4" fill="#00E396"/>
                <text x="12" y="4" fill="#94A3B8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12">Avg: <tspan fill="#F1F5F9" font-weight="700">${weeklyAvg}</tspan>/wk</text>
              </g>
            </g>

            ${gridLines}
            <path d="${areaPath}" fill="url(#apexArea)"/>
            <path d="${linePath}" fill="none" stroke="url(#apexLine)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            ${markers}
            ${xLabels}
          </svg>`;
          }


          (async () => {
            try {
              const result = await getContributions();
              if (!result || !result.data || !result.data.user) {
                throw new Error('Response data is undefined. Result: ' + JSON.stringify(result));
              }
              const data = result.data.user;
              const cal = data.contributionsCollection.contributionCalendar;
              const weeks = cal.weeks;

              // Calculate streaks
              let currentStreak = 0;
              let longestStreak = 0;
              let tempStreak = 0;
              const allDays = [];

              weeks.forEach(w => w.contributionDays.forEach(d => allDays.push(d)));

              // Current streak (from today backwards)
              for (let i = allDays.length - 1; i >= 0; i--) {
                if (allDays[i].contributionCount > 0) {
                  currentStreak++;
                } else {
                  break;
                }
              }

              // Longest streak
              allDays.forEach(d => {
                if (d.contributionCount > 0) {
                  tempStreak++;
                  if (tempStreak > longestStreak) longestStreak = tempStreak;
                } else {
                  tempStreak = 0;
                }
              });

              fs.mkdirSync('assets/stats', { recursive: true });

              fs.writeFileSync('assets/stats/streak.svg', generateStreakSVG(
                cal.totalContributions, currentStreak, longestStreak
              ));

              fs.writeFileSync('assets/stats/calendar.svg', generateCalendarSVG(weeks));

              const activitySvg = generateActivitySVG(weeks, cal.totalContributions);
              fs.writeFileSync('assets/stats/commit-activity.svg', activitySvg);
              fs.writeFileSync('assets/activity.svg', activitySvg);

              fs.writeFileSync('assets/stats/overview.svg', generateOverviewSVG(data));

              fs.writeFileSync('assets/stats/top-langs.svg', generateReposSVG(
                data.contributionsCollection.repositories.nodes
              ));

              console.log('Stats generated successfully!');
              console.log(`Total contributions: ${cal.totalContributions}`);
              console.log(`Current streak: ${currentStreak} days`);
              console.log(`Longest streak: ${longestStreak} days`);
            } catch (err) {
              console.error('Warning: Failed to fetch latest stats from GitHub API.', err.message);
              console.log('Using pre-generated local premium SVGs as fallback.');
            }
          })();
          SCRIPT
          node generate.js

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "chore: update GitHub stats [skip ci]"
          git push

