<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="GitHub Commit Activity Chart">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="apexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1326"/>
      <stop offset="100%" stop-color="#141B33"/>
    </linearGradient>

    <!-- Apex Primary Line Gradient (Electric Blue -> Emerald Green) -->
    <linearGradient id="apexLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008FFB"/>
      <stop offset="60%" stop-color="#00E396"/>
      <stop offset="100%" stop-color="#775DD0"/>
    </linearGradient>

    <!-- Area Fill Gradient -->
    <linearGradient id="apexArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#008FFB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#008FFB" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Card Border -->
    <linearGradient id="apexBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E374A"/>
      <stop offset="100%" stop-color="#1B213B"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas Card -->
  <rect width="1200" height="340" rx="12" fill="url(#apexBg)"/>
  <rect width="1198" height="338" x="1" y="1" rx="11" fill="none" stroke="url(#apexBorder)" stroke-width="1"/>

  <!-- Apex Title & Subtitle Header -->
  <g transform="translate(40, 42)">
    <text x="0" y="0" fill="#F1F5F9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Commit Activity</text>
    <text x="0" y="22" fill="#6C7A9C" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13">Monthly commit distribution over the last 12 months</text>
  </g>

  <!-- Legend & Quick Stats (Top Right) -->
  <g transform="translate(1160, 42)">
    <g transform="translate(-240, -4)">
      <!-- Legend Marker Blue -->
      <circle cx="0" cy="0" r="4" fill="#008FFB"/>
      <text x="12" y="4" fill="#94A3B8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12">Total: <tspan fill="#F1F5F9" font-weight="700">314</tspan></text>
    </g>
    <g transform="translate(-130, -4)">
      <!-- Legend Marker Green -->
      <circle cx="0" cy="0" r="4" fill="#00E396"/>
      <text x="12" y="4" fill="#94A3B8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12">Avg: <tspan fill="#F1F5F9" font-weight="700">6.0</tspan>/wk</text>
    </g>
  </g>

  <!-- Apex Grid Lines -->
  
      <line x1="70" y1="275.0" x2="1150" y2="275.0" stroke="#2E374A" stroke-dasharray="3 3"/>
