<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="GitHub Commit Activity Chart">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Area Fill Gradient -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Card Container -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1198" height="318" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Card Header -->
  <g transform="translate(40, 42)">
    <!-- Header Icon / Dot -->
    <circle cx="0" cy="-4" r="5" fill="#38BDF8" filter="url(#glow)"/>
    
    <!-- Title -->
    <text x="16" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">Commit Activity</text>
    <text x="155" y="0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">· Last 12 months</text>
  </g>

  <!-- Header Stat Badges (Right Side) -->
  <g transform="translate(1160, 42)">
    <!-- Badge 1: Total Commits -->
    <g transform="translate(-240, -14)">
      <rect x="0" y="0" width="115" height="28" rx="14" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="57.5" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
        <tspan fill="#38BDF8" font-weight="700">314</tspan> commits
      </text>
    </g>

    <!-- Badge 2: Avg / Week -->
    <g transform="translate(-115, -14)">
      <rect x="0" y="0" width="115" height="28" rx="14" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="57.5" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
        <tspan fill="#A78BFA" font-weight="700">6.0</tspan> / week
      </text>
    </g>
  </g>

  <!-- Grid Lines -->
  
      <line x1="60" y1="260.0" x2="1140" y2="260.0" stroke="#334155" stroke-opacity="0.25" stroke-dasharray="4 4"/>
      <text x="48" y="264.0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end">0</text>
    
      <line x1="60" y1="217.5" x2="1140" y2="217.5" stroke="#334155" stroke-opacity="0.25" stroke-dasharray="4 4"/>
      <text x="48" y="221.5" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end">23</text>
    
      <line x1="60" y1="175.0" x2="1140" y2="175.0" stroke="#334155" stroke-opacity="0.25" stroke-dasharray="4 4"/>
