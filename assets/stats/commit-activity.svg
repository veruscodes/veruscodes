      <line x1="60" y1="132.5" x2="1140" y2="132.5" stroke="#334155" stroke-opacity="0.25" stroke-dasharray="4 4"/>
      <text x="48" y="136.5" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end">68</text>
    
      <line x1="60" y1="90.0" x2="1140" y2="90.0" stroke="#334155" stroke-opacity="0.25" stroke-dasharray="4 4"/>
      <text x="48" y="94.0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end">90</text>
    

  <!-- Chart Area Fill -->
  <path d="M 60.0 237.3 C 73.1 234.3, 132.0 216.2, 158.2 214.7 C 184.4 213.2, 230.2 231.3, 256.4 226.0 C 282.5 220.7, 328.4 178.5, 354.5 175.0 C 380.7 171.5, 426.5 190.2, 452.7 199.6 C 478.9 208.9, 524.7 240.6, 550.9 244.9 C 577.1 249.2, 622.9 244.8, 649.1 231.7 C 675.3 218.6, 721.1 161.0, 747.3 146.7 C 773.5 132.3, 819.3 122.5, 845.5 124.0 C 871.6 125.5, 917.5 162.0, 943.6 158.0 C 969.8 154.0, 1015.6 85.7, 1041.8 93.8 C 1068.0 101.8, 1126.9 201.8, 1140.0 218.4 L 1140.0 260 L 60.0 260 Z" fill="url(#areaGrad)"/>

  <!-- Chart Main Line (Glowing) -->
  <path d="M 60.0 237.3 C 73.1 234.3, 132.0 216.2, 158.2 214.7 C 184.4 213.2, 230.2 231.3, 256.4 226.0 C 282.5 220.7, 328.4 178.5, 354.5 175.0 C 380.7 171.5, 426.5 190.2, 452.7 199.6 C 478.9 208.9, 524.7 240.6, 550.9 244.9 C 577.1 249.2, 622.9 244.8, 649.1 231.7 C 675.3 218.6, 721.1 161.0, 747.3 146.7 C 773.5 132.3, 819.3 122.5, 845.5 124.0 C 871.6 125.5, 917.5 162.0, 943.6 158.0 C 969.8 154.0, 1015.6 85.7, 1041.8 93.8 C 1068.0 101.8, 1126.9 201.8, 1140.0 218.4" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Data Nodes / Points -->
  
        <circle cx="60.0" cy="237.3" r="4" fill="#818CF8" stroke="#0F172A" stroke-width="1.5">
          <title>Jan: 12 commits</title>
        </circle>
      
        <circle cx="158.2" cy="214.7" r="4" fill="#818CF8" stroke="#0F172A" stroke-width="1.5">
          <title>Feb: 24 commits</title>
        </circle>
      
