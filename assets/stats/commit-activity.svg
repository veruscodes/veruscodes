        </circle>
      
        <circle cx="747.3" cy="146.7" r="4" fill="#818CF8" stroke="#0F172A" stroke-width="1.5">
          <title>Aug: 60 commits</title>
        </circle>
      
        <circle cx="845.5" cy="124.0" r="4" fill="#818CF8" stroke="#0F172A" stroke-width="1.5">
          <title>Sep: 72 commits</title>
        </circle>
      
        <circle cx="943.6" cy="158.0" r="4" fill="#818CF8" stroke="#0F172A" stroke-width="1.5">
          <title>Oct: 54 commits</title>
        </circle>
      
        <!-- Outer halo for peak -->
        <circle cx="1041.8" cy="93.8" r="9" fill="#38BDF8" fill-opacity="0.25" filter="url(#glow)"/>
        <circle cx="1041.8" cy="93.8" r="5" fill="#38BDF8" stroke="#0F172A" stroke-width="2"/>
        
        <!-- Peak Tooltip Badge -->
        <g transform="translate(1041.8, 61.8)">
          <rect x="-45" y="-18" width="90" height="24" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" filter="url(#dropShadow)"/>
          <text x="0" y="-2" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🔥 88 commits</text>
        </g>
      
        <circle cx="1140.0" cy="218.4" r="4" fill="#818CF8" stroke="#0F172A" stroke-width="1.5">
          <title>Dec: 22 commits</title>
        </circle>
      

  <!-- X-Axis Labels -->
  
      <line x1="60.0" y1="260" x2="60.0" y2="266" stroke="#334155" stroke-opacity="0.4"/>
      <text x="60.0" y="284" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Jan</text>
    
      <line x1="158.2" y1="260" x2="158.2" y2="266" stroke="#334155" stroke-opacity="0.4"/>
