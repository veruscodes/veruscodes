        <!-- Peak Highlight Pulse -->
        <circle cx="1051.8" cy="99.0" r="8" fill="#00E396" fill-opacity="0.25"/>
        <circle cx="1051.8" cy="99.0" r="5" fill="#00E396" stroke="#0E1326" stroke-width="2"/>
        
        <!-- Apex Tooltip Badge -->
