<svg width="780" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0883e"/>
      <stop offset="50%" style="stop-color:#f778ba"/>
      <stop offset="100%" style="stop-color:#bc8cff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="chip">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="780" height="180" fill="url(#bg)" rx="12"/>

  <!-- Header line -->
  <rect x="25" y="20" width="200" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Title -->
  <text x="25" y="48" fill="#f0883e" font-family="Arial, sans-serif" font-size="18" font-weight="bold">📊 Business Intelligence</text>
  <text x="260" y="48" fill="#484f58" font-family="Arial, sans-serif" font-size="12">· Transformação e análise de dados</text>

  <!-- BI Chips -->
  <!-- Row 1 -->
  <g filter="url(#chip)">
    <rect x="25" y="70" width="130" height="36" rx="18" fill="#21262d" stroke="#f0883e" stroke-width="1" opacity="0.8"/>
    <text x="50" y="93" fill="#f0883e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">📈</text>
    <text x="68" y="93" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="11">TARGIT BI</text>
  </g>

  <g filter="url(#chip)">
    <rect x="165" y="70" width="120" height="36" rx="18" fill="#21262d" stroke="#f778ba" stroke-width="1" opacity="0.8"/>
    <text x="185" y="93" fill="#f778ba" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🔄</text>
    <text x="203" y="93" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="11">ETL</text>
  </g>

  <g filter="url(#chip)">
    <rect x="295" y="70" width="140" height="36" rx="18" fill="#21262d" stroke="#bc8cff" stroke-width="1" opacity="0.8"/>
    <text x="315" y="93" fill="#bc8cff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">💾</text>
    <text x="333" y="93" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="11">InMemory</text>
  </g>

  <g filter="url(#chip)">
    <rect x="445" y="70" width="140" height="36" rx="18" fill="#21262d" stroke="#79c0ff" stroke-width="1" opacity="0.8"/>
    <text x="465" y="93" fill="#79c0ff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">⏰</text>
    <text x="483" y="93" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="11">Scheduler</text>
  </g>

  <!-- Row 2 -->
  <g filter="url(#chip)">
    <rect x="25" y="116" width="150" height="36" rx="18" fill="#21262d" stroke="#3fb950" stroke-width="1" opacity="0.8"/>
    <text x="45" y="139" fill="#3fb950" font-family="Arial, sans-serif" font-size="11" font-weight="bold">📊</text>
    <text x="63" y="139" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="11">Dashboards</text>
  </g>

  <g filter="url(#chip)">
    <rect x="185" y="116" width="175" height="36" rx="18" fill="#21262d" stroke="#58a6ff" stroke-width="1" opacity="0.8"/>
    <text x="205" y="139" fill="#58a6ff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🔬</text>
    <text x="223" y="139" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="11">Análise de Dados</text>
  </g>

  <g filter="url(#chip)">
    <rect x="370" y="116" width="150" height="36" rx="18" fill="#21262d" stroke="#f0883e" stroke-width="1" opacity="0.8"/>
    <text x="390" y="139" fill="#f0883e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">📋</text>
    <text x="408" y="139" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="11">KPIs &amp; Métricas</text>
  </g>

  <!-- Right side accent -->
  <text x="680" y="93" fill="#21262d" font-family="Arial, sans-serif" font-size="60" font-weight="bold" filter="url(#glow)" opacity="0.15">BI</text>
</svg>
