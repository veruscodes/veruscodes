<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" role="img" aria-label="ApexTree Professional Focus Diagram">
  <defs>
    <!-- Background Gradients for Cards -->
    <linearGradient id="rootBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="catBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="leafBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Line Gradients -->
    <linearGradient id="linePrimaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="480" rx="12" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>

  <!-- Connector Paths -->
  <g>
    <path d="M 250 240 C 295 240, 295 98, 340 98" fill="none" stroke="url(#linePrimaryGrad)" stroke-width="2"/>
  <path d="M 250 240 C 295 240, 295 240, 340 240" fill="none" stroke="url(#linePrimaryGrad)" stroke-width="2"/>
  <path d="M 250 240 C 295 240, 295 382, 340 382" fill="none" stroke="url(#linePrimaryGrad)" stroke-width="2"/>
  <path d="M 560 98 C 615 98, 615 61, 670 61" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 560 98 C 615 98, 615 131, 670 131" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 560 240 C 615 240, 615 203, 670 203" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 560 240 C 615 240, 615 273, 670 273" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 560 382 C 615 382, 615 345, 670 345" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 560 382 C 615 382, 615 415, 670 415" fill="none" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Nodes Group -->
  <g>
  
  <!-- Root Node -->
  <g transform="translate(50, 215)">
    <rect width="200" height="50" rx="8" fill="url(#rootBg)" stroke="#38BDF8" stroke-width="2"/>
    <text x="100" y="30" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="0.5" text-anchor="middle">Foco Profissional</text>
  </g>
  
    <!-- Category: Sistemas & Arquiteturas -->
    <g transform="translate(340, 75)">
      <rect width="220" height="46" rx="6" fill="url(#catBg)" stroke="#818CF8" stroke-width="1.5"/>
      <text x="110" y="28" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Sistemas & Arquiteturas</text>
    </g>
    
    <!-- Category: Integrações & Dados -->
    <g transform="translate(340, 217)">
      <rect width="220" height="46" rx="6" fill="url(#catBg)" stroke="#818CF8" stroke-width="1.5"/>
      <text x="110" y="28" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Integrações & Dados</text>
    </g>
    
    <!-- Category: Soluções de Negócio -->
    <g transform="translate(340, 359)">
      <rect width="220" height="46" rx="6" fill="url(#catBg)" stroke="#818CF8" stroke-width="1.5"/>
      <text x="110" y="28" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Soluções de Negócio</text>
    </g>
    
    <!-- Leaf: Full Stack (Foco em Back-end) -->
    <g transform="translate(670, 40)">
      <rect width="250" height="42" rx="4" fill="url(#leafBg)" stroke="#475569" stroke-width="1"/>
      <circle cx="20" cy="21" r="3.5" fill="#38BDF8"/>
      <text x="35" y="25" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start">Full Stack (Foco em Back-end)</text>
    </g>
    
    <!-- Leaf: Modernização de Legados -->
    <g transform="translate(670, 110)">
      <rect width="250" height="42" rx="4" fill="url(#leafBg)" stroke="#475569" stroke-width="1"/>
      <circle cx="20" cy="21" r="3.5" fill="#38BDF8"/>
      <text x="35" y="25" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start">Modernização de Legados</text>
    </g>
    
    <!-- Leaf: APIs & Automação de Processos -->
    <g transform="translate(670, 182)">
      <rect width="250" height="42" rx="4" fill="url(#leafBg)" stroke="#475569" stroke-width="1"/>
      <circle cx="20" cy="21" r="3.5" fill="#38BDF8"/>
      <text x="35" y="25" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start">APIs & Automação de Processos</text>
    </g>
    
    <!-- Leaf: Banco de Dados & Performance -->
    <g transform="translate(670, 252)">
      <rect width="250" height="42" rx="4" fill="url(#leafBg)" stroke="#475569" stroke-width="1"/>
      <circle cx="20" cy="21" r="3.5" fill="#38BDF8"/>
      <text x="35" y="25" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start">Banco de Dados & Performance</text>
    </g>
    
    <!-- Leaf: Plataformas SaaS & E-commerce -->
    <g transform="translate(670, 324)">
      <rect width="250" height="42" rx="4" fill="url(#leafBg)" stroke="#475569" stroke-width="1"/>
      <circle cx="20" cy="21" r="3.5" fill="#38BDF8"/>
      <text x="35" y="25" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start">Plataformas SaaS & E-commerce</text>
    </g>
    
    <!-- Leaf: Sistemas Críticos (Hospitalar) -->
    <g transform="translate(670, 394)">
      <rect width="250" height="42" rx="4" fill="url(#leafBg)" stroke="#475569" stroke-width="1"/>
      <circle cx="20" cy="21" r="3.5" fill="#38BDF8"/>
      <text x="35" y="25" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="start">Sistemas Críticos (Hospitalar)</text>
    </g>
      </g>
</svg>