<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" role="img" aria-label="ApexTree Professional Focus Diagram">
  <style>
    .text-root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 800;
      fill: #FFFFFF;
      letter-spacing: 0.5px;
    }
    .text-cat {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #E2E8F0;
    }
    .text-leaf {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #CBD5E1;
    }
    .line-primary {
      stroke: url(#linePrimaryGrad);
      stroke-dasharray: 4 4;
      animation: dash 30s linear infinite;
    }
    .line-secondary {
      stroke: #475569;
      opacity: 0.7;
    }
    .node rect {
      transition: all 0.3s ease;
    }
  </style>

  <defs>
    <!-- Background Gradients for Cards -->
    <linearGradient id="rootBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="catBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="leafBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Line Gradients -->
    <linearGradient id="linePrimaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas (Transparent or Dark Obsidian Theme) -->
  <rect width="960" height="480" rx="12" fill="#0B0F19" stroke="#1E293B" stroke-width="1"/>

  <!-- Connector Paths -->
  <g>
    <path d="M 250 240 C 295 240, 295 98, 340 98" fill="none" class="line-primary" stroke-width="2"/>
  <path d="M 250 240 C 295 240, 295 240, 340 240" fill="none" class="line-primary" stroke-width="2"/>
  <path d="M 250 240 C 295 240, 295 382, 340 382" fill="none" class="line-primary" stroke-width="2"/>
  <path d="M 560 98 C 615 98, 615 61, 670 61" fill="none" class="line-secondary" stroke-width="2"/>
  <path d="M 560 98 C 615 98, 615 131, 670 131" fill="none" class="line-secondary" stroke-width="2"/>
  <path d="M 560 240 C 615 240, 615 203, 670 203" fill="none" class="line-secondary" stroke-width="2"/>
  <path d="M 560 240 C 615 240, 615 273, 670 273" fill="none" class="line-secondary" stroke-width="2"/>
  <path d="M 560 382 C 615 382, 615 345, 670 345" fill="none" class="line-secondary" stroke-width="2"/>
  <path d="M 560 382 C 615 382, 615 415, 670 415" fill="none" class="line-secondary" stroke-width="2"/>
  </g>

  <!-- Nodes Group -->
  <g>
  
  <!-- Root Node -->
  <g class="node root-node" transform="translate(50, 215)">
    <rect width="200" height="50" rx="8" fill="url(#rootBg)" stroke="#38BDF8" stroke-width="2" filter="url(#nodeGlow)"/>
    <text x="100" y="30" class="text-root" text-anchor="middle">Foco Profissional</text>
  </g>
  
    <!-- Category: Sistemas & Arquiteturas -->
    <g class="node cat-node" transform="translate(340, 75)">
      <rect width="220" height="46" rx="6" fill="url(#catBg)" stroke="#818CF8" stroke-width="1.5"/>
      <text x="110" y="28" class="text-cat" text-anchor="middle">Sistemas & Arquiteturas</text>
    </g>
    
    <!-- Category: Integrações & Dados -->
    <g class="node cat-node" transform="translate(340, 217)">
      <rect width="220" height="46" rx="6" fill="url(#catBg)" stroke="#818CF8" stroke-width="1.5"/>
      <text x="110" y="28" class="text-cat" text-anchor="middle">Integrações & Dados</text>
    </g>
    
    <!-- Category: Soluções de Negócio -->
    <g class="node cat-node" transform="translate(340, 359)">
      <rect width="220" height="46" rx="6" fill="url(#catBg)" stroke="#818CF8" stroke-width="1.5"/>
      <text x="110" y="28" class="text-cat" text-anchor="middle">Soluções de Negócio</text>
    </g>
    
    <!-- Leaf: Full Stack (Foco em Back-end) -->
    <g class="node leaf-node" transform="translate(670, 40)">
      <rect width="250" height="42" rx="4" fill="url(#leafBg)" stroke="#475569" stroke-width="1"/>
      <!-- Small icon dot inside leaf -->
      <circle cx="20" cy="21" r="3" fill="#38BDF8"/>
      <text x="35" y="25" class="text-leaf" text-anchor="start">Full Stack (Foco em Back-end)</text>
    </g>
    
    <!-- Leaf: Modernização de Legados -->
    <g class="node leaf-node" transform="translate(670, 110)">
      <rect width="250" height="42" rx="4" fill="url(#leafBg)" stroke="#475569" stroke-width="1"/>
      <!-- Small icon dot inside leaf -->
      <circle cx="20" cy="21" r="3" fill="#38BDF8"/>
      <text x="35" y="25" class="text-leaf" text-anchor="start">Modernização de Legados</text>
    </g>
    
    <!-- Leaf: APIs & Automação de Processos -->
    <g class="node leaf-node" transform="translate(670, 182)">
      <rect width="250" height="42" rx="4" fill="url(#leafBg)" stroke="#475569" stroke-width="1"/>
      <!-- Small icon dot inside leaf -->
      <circle cx="20" cy="21" r="3" fill="#38BDF8"/>
      <text x="35" y="25" class="text-leaf" text-anchor="start">APIs & Automação de Processos</text>
    </g>
    
    <!-- Leaf: Banco de Dados & Performance -->
    <g class="node leaf-node" transform="translate(670, 252)">
      <rect width="250" height="42" rx="4" fill="url(#leafBg)" stroke="#475569" stroke-width="1"/>
      <!-- Small icon dot inside leaf -->
      <circle cx="20" cy="21" r="3" fill="#38BDF8"/>
      <text x="35" y="25" class="text-leaf" text-anchor="start">Banco de Dados & Performance</text>
    </g>
    
    <!-- Leaf: Plataformas SaaS & E-commerce -->
    <g class="node leaf-node" transform="translate(670, 324)">
      <rect width="250" height="42" rx="4" fill="url(#leafBg)" stroke="#475569" stroke-width="1"/>
      <!-- Small icon dot inside leaf -->
      <circle cx="20" cy="21" r="3" fill="#38BDF8"/>
      <text x="35" y="25" class="text-leaf" text-anchor="start">Plataformas SaaS & E-commerce</text>
    </g>
    
    <!-- Leaf: Sistemas Críticos (Hospitalar) -->
    <g class="node leaf-node" transform="translate(670, 394)">
      <rect width="250" height="42" rx="4" fill="url(#leafBg)" stroke="#475569" stroke-width="1"/>
      <!-- Small icon dot inside leaf -->
      <circle cx="20" cy="21" r="3" fill="#38BDF8"/>
      <text x="35" y="25" class="text-leaf" text-anchor="start">Sistemas Críticos (Hospitalar)</text>
    </g>
      </g>
</svg>